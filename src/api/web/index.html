<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zdos &mdash; live</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <!-- The WebGL2 surface. The backing store is resized to the guest resolution
       on every (width,height) change; CSS scales it to the viewport (NEAREST +
       image-rendering:pixelated keep the upscale crisp). -->
  <canvas id="screen" width="320" height="200" tabindex="0"
          data-marker="zdos-player-canvas"></canvas>

  <!-- Shown when the guest is in a mode the player can't render (text mode or an
       unsupported flag), or while (re)connecting. Hidden during normal streaming.
       The socket is NEVER torn down for an unsupported frame; streaming resumes
       automatically when a renderable frame arrives. -->
  <div id="overlay" class="overlay">
    <div id="overlay-msg" class="overlay-msg">connecting&hellip;</div>
  </div>
</div>

<div id="hud" class="hud">
  <span id="status" class="status pending">connecting&hellip;</span>
  <span id="info" class="info"></span>

  <!-- CPU SPEED knob (Phase 3). Changes CPU cycles/sec (rendering smoothness),
       NOT game pace — the PIT/timer wall rate is invariant to this, so a faster
       CPU only fixes frame-render lag. It is NOT a fast-forward. The label shows
       the derived ≈MHz; the underlying control is the integer CPU:PIT multiplier
       (mult). The initial value is synced from GET /api/cpu/clock. -->
  <label id="cpu-knob" class="knob" title="CPU speed (smoothness) — does NOT change game pace">
    <span class="knob-label">CPU</span>
    <input id="cpu-speed" class="knob-range" type="range" min="1" max="55" step="1" value="12">
    <span id="cpu-mhz" class="knob-val">&#8776;14.32 MHz</span>
  </label>
</div>

<script src="app.js"></script>
</body>
</html>
